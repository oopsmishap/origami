name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run bench -- --turns 200 --assert --json benchmark.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: benchmark.json
